---
- name: Install the EVE-only tunnel
  block:
    - name: Copy the WireGuard configuration (root-only, temporary)
      become: true
      ansible.builtin.copy:
        src: "{{ yutani_wg_conf }}"
        dest: /root/yutani-wg.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      # Scaffolding for the step below, removed again in `always`: not a
      # change to the machine.
      changed_when: false

    - name: Write the tunnel unit, conf and polkit rule
      become: true
      ansible.builtin.command:
        argv: >-
          {{ [yutani_prefix ~ '/yutani', 'tunnel', 'install-root',
              '--conf', '/root/yutani-wg.conf',
              '--uid', yutani_uid | string,
              '--user', yutani_user,
              '--exe', yutani_prefix ~ '/yutani']
             + (['--dns-servers', yutani_dns_servers | join(',')] if yutani_dns_servers | length > 0 else [])
             + (['--dns-domains', yutani_dns_domains | join(',')] if yutani_dns_domains | length > 0 else []) }}
      register: yutani_tunnel_install
      # `install-root` ends its report with this line when every file it
      # writes already held exactly that (same conf, same DNS settings):
      # the marker is `NOTHING_CHANGED_MARKER` in src/tunnel/install.rs.
      changed_when: "'# nothing changed:' not in yutani_tunnel_install.stdout"
      # The report names the endpoint and address; keep them out of the log.
      # On failure, re-run the command by hand as root to see the reason.
      no_log: true
  always:
    - name: Remove the temporary configuration
      become: true
      ansible.builtin.file:
        path: /root/yutani-wg.conf
        state: absent
      changed_when: false
