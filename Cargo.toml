[package]
name = "yutani"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Live thumbnails and client switching for EVE Online on COSMIC"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "a401af8b1c54a8abd393b8c5b7c8809402f83850", default-features = false, features = [
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    "wgpu",
    "single-instance",
] }
calloop = { version = "0.14.4", features = ["executor"] }
calloop-wayland-source = "0.4.1"
gbm = "0.18.0"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }
futures-timer = "3"
notify = "8"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "signal", "time"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same version and (default) features libcosmic already pulls in via
# smithay-client-toolkit, so this adds no new dependency to the build.
xkbcommon = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
