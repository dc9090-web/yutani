[package]
name = "yutani"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Live thumbnails and client switching for EVE Online on COSMIC"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "a401af8b1c54a8abd393b8c5b7c8809402f83850", default-features = false, features = [
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    "wgpu",
    "single-instance",
    "applet",
    # The XDG file-chooser portal, for the Tunnel page's Browse… button
    # (`ui::App::browse_tunnel_conf`).
    "xdg-portal",
] }
calloop = { version = "0.14.4", features = ["executor"] }
calloop-wayland-source = "0.4.1"
gbm = "0.18.0"
khronos-egl = { version = "6", features = ["dynamic"] }
glow = "0.16"
futures-timer = "3"
notify = "8"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "signal", "time", "macros"] }
serde_json = "1"
anyhow = "1"
# Already in the tree via tokio and friends; only the `O_*` flag constants
# are used (`tunnel::install::conf_guard`).
libc = "0.2"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ron = "0.10"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Same version and (default) features libcosmic already pulls in via
# smithay-client-toolkit, so this adds no new dependency to the build.
xkbcommon = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wayland-backend 0.3.17 with one fix in `ConnectionState::drop` (see
# vendor/wayland-backend/README.yutani.md): dropping a backend made with
# `from_foreign_display` — which libcosmic does for every clipboard it
# replaces — freed the user data of its proxies without marking them dead,
# and an event already queued on the SCTK thread that named one of them
# (`wl_surface.enter(wl_output)`) then read freed memory. Remove this patch
# once upstream wayland-rs ships the same change.
[patch.crates-io]
wayland-backend = { path = "vendor/wayland-backend" }
